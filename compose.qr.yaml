services:
  whatsapp-qr:
    build:
      context: .
      dockerfile: Dockerfile.qr
    env_file: .env.qr
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    stop_grace_period: 40s
